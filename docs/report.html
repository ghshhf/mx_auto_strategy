<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>报告查看器 · mx_auto_strategy</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2933; --sub:#616e7c; --line:#e4e7eb;
    --accent:#2980b9; --code-bg:#f0f2f5; --quote:#eef4fb; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    line-height:1.7;font-size:15px}
  .top{position:sticky;top:0;background:rgba(245,247,250,.92);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:10px 20px;z-index:10}
  .top a{color:var(--accent);text-decoration:none;font-size:13.5px;font-weight:600}
  .top a:hover{text-decoration:underline}
  .top .name{color:var(--sub);font-size:12px;margin-left:10px}
  .wrap{max-width:900px;margin:0 auto;padding:28px 22px 80px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:30px 34px}
  h1{font-size:25px;margin:0 0 16px;line-height:1.3;padding-bottom:12px;border-bottom:2px solid var(--line)}
  h2{font-size:20px;margin:30px 0 12px;padding-left:10px;border-left:4px solid var(--accent)}
  h3{font-size:16.5px;margin:24px 0 10px;color:#2c3a47}
  h4,h5,h6{margin:18px 0 8px;color:#37434f}
  p{margin:10px 0}
  ul,ol{margin:10px 0;padding-left:24px}
  li{margin:4px 0}
  code{background:var(--code-bg);padding:1px 6px;border-radius:4px;font-size:13px;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  pre{background:#1f2933;color:#e6e9ef;padding:16px 18px;border-radius:10px;overflow:auto;
    font-size:13px;line-height:1.55}
  pre code{background:none;padding:0;color:inherit;font-size:13px}
  blockquote{margin:14px 0;padding:10px 16px;background:var(--quote);
    border-left:4px solid var(--accent);border-radius:0 8px 8px 0;color:#37434f}
  blockquote p{margin:6px 0}
  table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13.5px}
  th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  th{background:#fafbfc;font-weight:600;color:var(--sub)}
  tbody tr:nth-child(even){background:#fafbfc}
  a{color:var(--accent)}
  hr{border:none;border-top:1px solid var(--line);margin:26px 0}
  .meta{color:var(--sub);font-size:12.5px;margin-bottom:18px}
  .state{padding:40px;text-align:center;color:var(--sub);font-size:14px}
  .err{color:#c0392b;background:#fdecea;padding:14px 16px;border-radius:8px;font-size:13.5px}
  .banner{margin:0 0 16px;padding:10px 14px;border-radius:8px;font-size:12.5px;
    background:#fffaf0;border:1px solid #f6e2bd;color:#7a5b15}
</style>
</head>
<body>
<div class="top">
  <a href="index.html">← 返回中枢</a>
  <span class="name" id="rname">报告查看器</span>
</div>
<div class="wrap">
  <div class="card" id="content">
    <div class="state" id="state">正在加载报告…</div>
  </div>
</div>

<script>
// ===MD_PARSER_START===
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function inlineMd(text){
  let s = escapeHtml(text);
  // internal .md links -> viewer
  s = s.replace(/\[([^\]]+)\]\(([^)]+\.md)(?:#[^)]*)?\)/g,
    (m,t,u)=>'<a href="report.html?r='+u.replace(/^\.\//,'')+'" target="_blank" rel="noopener">'+t+'</a>');
  // external / other links
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
    (m,t,u)=>'<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>');
  // code spans
  s = s.replace(/`([^`]+)`/g, (m,c)=>'<code>'+c+'</code>');
  // bold
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // italic
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return s;
}

function splitRow(line){
  let s=line.trim();
  if(s.startsWith('|')) s=s.slice(1);
  if(s.endsWith('|')) s=s.slice(0,-1);
  return s.split('|').map(c=>c.trim());
}

function renderList(items){
  let html='<ul>', k=0;
  while(k<items.length){
    const it=items[k];
    if(it.indent===0){
      let sub=[], j=k+1;
      while(j<items.length && items[j].indent>0){ sub.push(items[j].text); j++; }
      html+='<li>'+it.text;
      if(sub.length) html+='<ul>'+sub.map(s=>'<li>'+s+'</li>').join('')+'</ul>';
      html+='</li>'; k=j;
    } else k++;
  }
  return html+'</ul>';
}

function mdToHtml(md){
  const lines = md.replace(/\r\n?/g,'\n').split('\n');
  const out=[]; let i=0;
  while(i<lines.length){
    const line=lines[i];
    // code fence
    if(/^```/.test(line.trim())){
      i++; const code=[];
      while(i<lines.length && !/^```/.test(lines[i].trim())){ code.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>');
      continue;
    }
    // heading
    const h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const l=h[1].length; out.push('<h'+l+'>'+inlineMd(h[2])+'</h'+l+'>'); i++; continue; }
    // hr
    if(/^---+\s*$/.test(line)){ out.push('<hr>'); i++; continue; }
    // blockquote
    if(/^>\s?/.test(line)){
      const bq=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){ bq.push(lines[i].replace(/^>\s?/,'')); i++; }
      out.push('<blockquote>'+mdToHtml(bq.join('\n'))+'</blockquote>');
      continue;
    }
    // table
    if(line.includes('|') && i+1<lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].includes('-')){
      const head=splitRow(line); i+=2; const rows=[];
      while(i<lines.length && lines[i].includes('|') && lines[i].trim()!==''){ rows.push(splitRow(lines[i])); i++; }
      let t='<table><thead><tr>'+head.map(c=>'<th>'+inlineMd(c)+'</th>').join('')+'</tr></thead><tbody>';
      rows.forEach(r=>{ t+='<tr>'+r.map(c=>'<td>'+inlineMd(c)+'</td>').join('')+'</tr>'; });
      t+='</tbody></table>'; out.push(t); continue;
    }
    // unordered list (tolerate blank lines between items)
    if(/^\s*[-*]\s+/.test(line)){
      const items=[];
      while(i<lines.length){
        if(/^\s*[-*]\s+/.test(lines[i])){
          const m=lines[i].match(/^(\s*)[-*]\s+(.*)$/);
          items.push({indent:m[1].length, text:inlineMd(m[2])}); i++;
        } else if(lines[i].trim()==='' && i+1<lines.length && /^\s*[-*]\s+/.test(lines[i+1])){ i++; }
        else break;
      }
      out.push(renderList(items)); continue;
    }
    // ordered list
    if(/^\s*\d+\.\s+/.test(line)){
      const items=[];
      while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){
        const m=lines[i].match(/^\s*\d+\.\s+(.*)$/); items.push(inlineMd(m[1])); i++;
      }
      out.push('<ol>'+items.map(t=>'<li>'+t+'</li>').join('')+'</ol>'); continue;
    }
    // blank
    if(line.trim()===''){ i++; continue; }
    // paragraph
    const para=[];
    while(i<lines.length && lines[i].trim()!=='' &&
      !/^(#{1,6})\s|^>\s?|^```|^\s*[-*]\s+|^\s*\d+\.\s+|^\s*\|/.test(lines[i]) &&
      !/^---+\s*$/.test(lines[i])){ para.push(lines[i]); i++; }
    out.push('<p>'+inlineMd(para.join(' '))+'</p>');
  }
  return out.join('\n');
}
// ===MD_PARSER_END===

(async function(){
  const params=new URLSearchParams(location.search);
  const file=(params.get('r')||'TRUTH.md').replace(/^\.\//,'');
  document.getElementById('rname').textContent=' · '+file;
  const state=document.getElementById('state');
  const content=document.getElementById('content');
  try{
    const res=await fetch(file, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status+' 文件不存在: '+file);
    const md=await res.text();
    const title=(md.match(/^#\s+(.*)$/m)||[])[1]||file;
    const body=md.replace(/^#\s+.*$/m,''); // drop first h1 (shown as page title)
    content.innerHTML='<h1>'+inlineMd(title)+'</h1>'+
      '<div class="banner">研究性质声明：本报告为<b>历史回测</b>结果，非未来收益承诺，不构成投资建议。加密含<b>幸存者偏差</b>。</div>'+
      mdToHtml(body);
    document.title=title+' · mx_auto_strategy';
  }catch(err){
    content.innerHTML='<div class="err">报告加载失败：'+err.message+
      '<br><br>请确认通过 HTTP 访问（GitHub Pages 或本地服务器），而非直接 file:// 打开。'+
      '<br>若文件确已存在，可能是路径或文件名大小写不一致。</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
