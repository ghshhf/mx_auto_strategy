# 可选: pre-commit 钩子 (pip install pre-commit && pre-commit install 后生效)
# 只做 py3.11 语法门禁 (E9 = 语法错误族), 与 CI lint job / make lint 同一标准。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--target-version", "py311", "--select", "E9", "--no-cache"]
