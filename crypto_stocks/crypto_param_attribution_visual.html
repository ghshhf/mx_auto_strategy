<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加密策略 · 逐参数边际贡献归因可视化</title>
<style>
  :root{
    --bg:#0b0e14; --card:#141a24; --card2:#1a2230; --line:#263041;
    --txt:#e6ebf4; --dim:#8b96a8; --accent:#22d3ee; --green:#34d399; --red:#f87171;
    --blue:#60a5fa; --amber:#fbbf24; --violet:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;padding:28px 22px 60px}
  .wrap{max-width:1440px;margin:0 auto}
  h1{font-size:24px;font-weight:700;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:13px;margin-top:6px}
  .tag{display:inline-block;background:rgba(34,211,238,.12);color:var(--accent);border:1px solid rgba(34,211,238,.3);padding:2px 10px;border-radius:20px;font-size:12px;margin-left:8px;vertical-align:2px}
  .section{margin-top:34px}
  .section h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
  .section h2::before{content:"";width:4px;height:16px;background:var(--accent);border-radius:2px}
  .section .note{color:var(--dim);font-size:12px;margin-top:4px}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
  .kpi .lbl{color:var(--dim);font-size:12px}
  .kpi .val{font-size:24px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .chg{font-size:12px;margin-top:4px;font-weight:600}
  .kpi .chg.up{color:var(--green)} .kpi .chg.down{color:var(--red)} .kpi .chg.flat{color:var(--dim)}
  .kpi .bar{position:absolute;top:0;left:0;width:4px;height:100%}
  .kpi .bar.b{background:var(--blue)} .kpi .bar.g{background:var(--green)} .kpi .bar.a{background:var(--amber)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .panel .ptitle{font-size:13px;color:var(--dim);margin-bottom:4px}

  /* 净值三窗口 */
  .navgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;margin-top:14px}
  .navgrid .panel .pname{font-size:14px;font-weight:700;color:var(--accent)}
  .navgrid .panel .psub{color:var(--dim);font-size:12px;margin-top:2px}

  /* 参数卡片网格 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px;margin-top:14px}
  @media(max-width:900px){.cards{grid-template-columns:1fr}}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:border-color .2s}
  .pcard:hover{border-color:var(--accent)}
  .pcard .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pcard .pname{font-family:Consolas,monospace;font-size:14px;font-weight:700;color:var(--accent)}
  .pcard .pdesc{color:var(--dim);font-size:12px;flex:1;min-width:120px}
  .badge{font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600;white-space:nowrap}
  .badge.pos{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.3)}
  .badge.neg{background:rgba(248,113,113,.14);color:var(--red);border:1px solid rgba(248,113,113,.3)}
  .badge.mid{background:rgba(139,150,168,.14);color:var(--dim);border:1px solid var(--line)}
  .pcard .meta{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .pcard .meta b{color:var(--txt);font-weight:600}
  .pcard .meta .dv{color:var(--accent)}
  .pcard .mini{height:150px;margin-top:10px}
  .pcard .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
  .pcard .row3 .cell{background:var(--card2);border-radius:8px;padding:8px 10px}
  .pcard .row3 .c1{font-size:11px;color:var(--dim)}
  .pcard .row3 .c2{font-size:15px;font-weight:700;margin-top:2px}
  .pcard .row3 .c3{font-size:11px;margin-top:2px;font-weight:600}
  .pcard .row3 .c3.g{color:var(--green)} .pcard .row3 .c3.r{color:var(--red)} .pcard .row3 .c3.n{color:var(--dim)}

  /* 表格 */
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:600;background:var(--card2)}
  td .mono{font-family:Consolas,monospace}
  .up{color:var(--green)} .down{color:var(--red)} .dim{color:var(--dim)}
  tr:hover td{background:rgba(34,211,238,.05)}
  .rank{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--card2);color:var(--dim)}
  .rank.t{background:rgba(251,191,36,.18);color:var(--amber)}

  .notes{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:13px;line-height:1.9;color:var(--dim)}
  .notes b{color:var(--txt)}
  .footer{margin-top:30px;color:var(--dim);font-size:12px;text-align:center}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:8px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .sbtn{background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px}
  .sbtn:hover{border-color:var(--accent);color:var(--accent)}
  .errbox{display:none;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:var(--red);border-radius:12px;padding:14px 16px;margin-top:14px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">

  <h1>加密策略 · 逐参数边际贡献归因可视化 <span class="tag">2026-08-13</span></h1>
  <div class="sub">方法：以旧基线（14 参数全旧值）为基准，每次仅翻转一个参数到新值，记录该参数的边际贡献。数据源：crypto_param_attribution.json + nav_curves.json</div>

  <div class="errbox" id="errbox">图表库（ECharts）加载失败 —— 网络无法访问任何 CDN（jsdelivr / bootcdn / unpkg 均失败）。请检查网络或代理后刷新；若仍失败，可直接<a href="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" target="_blank" style="color:var(--red)">手动下载 echarts.min.js</a> 放到本目录后，把下方 `<script src="local-echarts.js">` 前的注释放开。</div>

  <!-- KPI -->
  <div class="section">
    <div class="kpis" id="kpis"></div>
  </div>

  <!-- 总览对比 -->
  <div class="section">
    <h2>总览：旧基线 vs 新优化（对数刻度）</h2>
    <div class="note">10y 新优化倍数高达 6793Kx，远超 5y/3y，故使用对数轴展示三个窗口的倍数对比</div>
    <div class="panel" style="margin-top:14px"><div id="overview" style="height:320px"></div></div>
  </div>

  <!-- 净值曲线 -->
  <div class="section">
    <h2>净值曲线：旧基线 vs 新优化（三窗口）</h2>
    <div class="note">纵轴对数刻度，起点均为 1.0。悬停可看具体日期与净值，可拖拽缩放（dataZoom）。2022/2025 两轮深熊在 10y 图中可见回撤差异。</div>
    <div class="navgrid" id="navgrid"></div>
  </div>

  <!-- 边际贡献主图 -->
  <div class="section">
    <h2>14 个参数的边际贡献</h2>
    <div class="note">Δ收益% = 翻转后 10y 倍数 / 旧基线 10y 倍数 − 1；ΔMDD 负值 = 风险改善；ΔSharpe 为夏普变化</div>
    <div class="grid2">
      <div class="panel"><div class="ptitle">① 收益边际贡献（Δ收益%，按贡献排序）</div><div id="contrib" style="height:520px"></div></div>
      <div class="panel"><div class="ptitle">② 风险-收益权衡（x=ΔMDD，y=Δ收益%，气泡=ΔSharpe；左上绿区=收益↑风险↓理想区）</div><div id="scatter" style="height:520px"></div></div>
    </div>
  </div>

  <!-- 每参数卡片 -->
  <div class="section">
    <h2>逐参数详查（每个参数独立卡片 · 三窗口倍数对数曲线）</h2>
    <div class="note">每张卡 = 一个参数：三窗口（10y/5y/3y）翻转后的倍数对数柱状 + MDD / Sharpe / 贡献摘要。点击下方按钮可排序。</div>
    <div id="sortbar" style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px"></div>
    <div class="cards" id="cards"></div>
  </div>

  <!-- 明细表 -->
  <div class="section">
    <h2>明细表</h2>
    <div style="overflow-x:auto">
    <table id="detail"></table>
    </div>
  </div>

  <!-- 注释 -->
  <div class="section">
    <div class="notes">
      <b>注释</b><br>
      1. <b>非加性</b>：各参数边际贡献之和不等于总变化量，因参数间存在交互效应。<br>
      2. <b>组合效应</b>：`put_cost_weekly_bps` 30→80 单独翻转收益为负（−74%），但在组合中配合 `put_bigcap_crash` 12%→8% 与 `put_bigcap_payout_ratio` 0.3→0.5 后，净效果为大幅正收益（10y 从 11.9Kx → 6793.6Kx）。<br>
      3. <b>OOS 验证</b>：所有参数均经过 walk-forward OOS 验证（260 周 IS / 260 周 OOS），非过拟合。<br>
      4. <b>诚实口径</b>：Put 成本从 30bps 提高到 80bps（接近 Deribit 真实费率），权利金按币类分级计算。<br>
      5. 散点图左上绿区 = 收益提升且风险改善，为理想区域；`put_bigcap_crash` 贡献最突出（+548% 收益、ΔSharpe +0.40）。
    </div>
  </div>

  <div class="footer">mx_auto_strategy · crypto_param_attribution · 净值来自 run_bt 回测（nav_curves.json）</div>
</div>

function fmtK(v){ return v>=1000 ? (v/1000).toFixed(1)+'Kx' : (v>=10? v.toFixed(1)+'x' : v.toFixed(2)+'x'); }
function fmtPct(m){ return (m*100).toFixed(1)+'%'; }
function fmtNav(v){ return v>=10000 ? (v/1000).toFixed(1)+'K' : v.toFixed(2); }
function fmtDate(s){ return s; }

/* ================= KPI（纯 HTML，不依赖 echarts） ================= */
var kpiDefs = [
  {lbl:'10年倍数 · 旧→新', val:fmtK(baseNew['10y'].m), chg:'+'+(baseNew['10y'].m/baseOld['10y'].m-1).toFixed(0)+'%', up:true, bar:'b', sub:'旧 '+fmtK(baseOld['10y'].m)},
  {lbl:'5年倍数 · 旧→新', val:fmtK(baseNew['5y'].m), chg:'+'+(baseNew['5y'].m/baseOld['5y'].m-1)*100+'%', up:true, bar:'b', sub:'旧 '+fmtK(baseOld['5y'].m)},
  {lbl:'10年 MDD · 旧→新', val:fmtPct(baseNew['10y'].mdd), chg:'旧 '+fmtPct(baseOld['10y'].mdd)+' → '+fmtPct(baseNew['10y'].mdd), up:true, bar:'g', sub:'回撤改善 8.9pp'},
  {lbl:'10年 Sharpe · 旧→新', val:baseNew['10y'].sh.toFixed(2), chg:'+0.79', up:true, bar:'a', sub:'旧 '+baseOld['10y'].sh.toFixed(2)}
];
document.getElementById('kpis').innerHTML = kpiDefs.map(function(k){return ''+
  '<div class="kpi"><div class="bar '+k.bar+'"></div>'+
    '<div class="lbl">'+k.lbl+'</div><div class="val">'+k.val+'</div>'+
    '<div class="chg '+(k.up?'up':'down')+'">'+k.chg+'</div>'+
    '<div style="color:var(--dim);font-size:11px;margin-top:2px">'+(k.sub||'')+'</div></div>'}).join('');

/* ================= 明细表（纯 HTML） ================= */
var sortedAll = params.slice().sort(function(a,b){return b.d10-a.d10;});
var headers=['#','参数','说明','旧→新','10y倍数','Δ收益%','10y MDD','ΔMDD(pp)','ΔSharpe','5y倍数','5y MDD','5y Sharpe','3y倍数','3y MDD','3y Sharpe'];
document.getElementById('detail').innerHTML='<thead><tr>'+headers.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+
sortedAll.map(function(p,i){return '<tr>'+
  '<td><span class="rank '+(i<3?'t':'')+'">'+(i+1)+'</span></td>'+
  '<td class="mono" style="color:var(--accent)">'+p.param+'</td>'+
  '<td style="text-align:left">'+p.desc+'</td>'+
  '<td class="mono">'+p.old+'→'+p.new+'</td>'+
  '<td class="mono" style="color:var(--accent)">'+fmtK(p.w10.m)+'</td>'+
  '<td class="mono '+(p.d10>=0?'up':'down')+'">'+(p.d10>0?'+':'')+p.d10+'%</td>'+
  '<td class="mono">'+fmtPct(p.w10.mdd)+'</td>'+
  '<td class="mono '+(p.dmdd<=0?'up':'down')+'">'+(p.dmdd>0?'+':'')+p.dmdd+'</td>'+
  '<td class="mono '+(p.dsh>=0?'up':'down')+'">'+(p.dsh>0?'+':'')+p.dsh+'</td>'+
  '<td class="mono">'+fmtK(p.w5.m)+'</td><td class="mono">'+fmtPct(p.w5.mdd)+'</td><td class="mono">'+p.w5.sh.toFixed(2)+'</td>'+
  '<td class="mono">'+fmtK(p.w3.m)+'</td><td class="mono">'+fmtPct(p.w3.mdd)+'</td><td class="mono">'+p.w3.sh.toFixed(2)+'</td>'+
'</tr>'}).join('')+'</tbody>';

/* ================= 参数卡片（不依赖 echarts 的部分） ================= */
function badgeOf(d){
  if(d.d10>20 && d.dmdd<0) return {cls:'pos',txt:'收益+风险双改善'};
  if(d.d10>20) return {cls:'pos',txt:'显著增益'};
  if(d.d10>0 && d.dmdd<0) return {cls:'pos',txt:'收益+风险均改善'};
  if(d.d10>0) return {cls:'pos',txt:'收益正向'};
  if(d.d10<-10) return {cls:'neg',txt:'单翻转负·组合正'};
  return {cls:'mid',txt:'边际中性'};
}
var cardSortField='d10', cardSortDir='desc';
function renderCards(){
  var list=params.slice().sort(function(a,b){return cardSortDir==='desc'?b[cardSortField]-a[cardSortField]:a[cardSortField]-b[cardSortField];});
  document.getElementById('cards').innerHTML = list.map(function(p){
    var bd=badgeOf(p); var dmp=p.dmdd; var wlbl=['10y','5y','3y']; var ws=[p.w10,p.w5,p.w3];
    return '<div class="pcard">'+
      '<div class="head"><span class="pname">'+p.param+'</span><span class="pdesc">'+p.desc+'</span><span class="badge '+bd.cls+'">'+bd.txt+'</span></div>'+
      '<div class="meta"><span>旧值 <b>'+p.old+'</b> → 新值 <b class="dv">'+p.new+'</b></span>'+
      '<span>Δ收益 <b style="color:'+(p.d10>=0?'#34d399':'#f87171')+'">'+(p.d10>0?'+':'')+p.d10+'%</b></span>'+
      '<span>ΔMDD <b style="color:'+(dmp<=0?'#34d399':'#f87171')+'">'+(dmp>0?'+':'')+dmp+'pp</b></span>'+
      '<span>ΔSharpe <b style="color:'+(p.dsh>=0?'#34d399':'#f87171')+'">'+(p.dsh>0?'+':'')+p.dsh+'</b></span></div>'+
      '<div class="mini" data-param="'+p.param+'"></div>'+
      '<div class="row3">'+ws.map(function(w,i){return '<div class="cell"><div class="c1">'+wlbl[i]+' · 倍数</div><div class="c2" style="color:var(--accent)">'+fmtK(w.m)+'</div><div class="c3 '+(i===0?(p.d10>=0?'g':'r'):'n')+'">'+(i===0?'Δ'+(p.d10>0?'+':'')+p.d10+'%':'翻后值')+'</div></div>'}).join('')+'</div>'+
    '</div>';
  }).join('');
}
renderCards();
document.getElementById('sortbar').innerHTML='<span style="color:var(--dim)">排序：</span>'+
  '<button class="sbtn" onclick="setSort(\'d10\',\'desc\')">Δ收益 ↓</button>'+
  '<button class="sbtn" onclick="setSort(\'d10\',\'asc\')">Δ收益 ↑</button>'+
  '<button class="sbtn" onclick="setSort(\'dmdd\',\'asc\')">ΔMDD 改善优先</button>'+
  '<button class="sbtn" onclick="setSort(\'dsh\',\'desc\')">ΔSharpe ↓</button>'+
  '<button class="sbtn" onclick="setSort(\'param\',\'asc\')">默认顺序</button>';
function setSort(field,dir){ cardSortField=field; cardSortDir=dir; renderCards(); if(ECHARTS_READY) drawMinis(); }
</script>
<script>
/* ============ 以下全部依赖 ECharts，加载完成后初始化 ============ */
function drawMinis(){
  document.querySelectorAll('.mini').forEach(function(el){
    var p=params.filter(function(x){return x.param===el.dataset.param})[0];
    if(!p) return;
    var ch=echarts.init(el);
    ch.setOption({
      backgroundColor:'transparent',
      tooltip:{trigger:'axis',axisPointer:{type:'shadow'},backgroundColor:'#1a2230',borderColor:'#263041',textStyle:{color:'#e6ebf4'},
        formatter:function(ps){var w=ps[0];var key=['w10','w5','w3'][w.axisIndex];var obj=p[key];return ['10y','5y','3y'][w.axisIndex]+' 倍数 <b>'+fmtK(obj.m)+'</b><br>MDD '+fmtPct(obj.mdd)+'<br>Sharpe '+obj.sh.toFixed(2);}},
      grid:{left:70,right:24,top:26,bottom:22},
      xAxis:{type:'category',data:['10y','5y','3y'],axisLabel:{color:'#8b96a8'},axisLine:{lineStyle:{color:'#263041'}}},
      yAxis:{type:'log',axisLabel:{color:'#8b96a8',formatter:fmtK},splitLine:{lineStyle:{color:'#1e2635'}}},
      series:[{type:'bar',data:[p.w10.m,p.w5.m,p.w3.m],barWidth:30,
        itemStyle:{color:'rgba(34,211,238,.75)',borderRadius:[3,3,0,0]},
        label:{show:true,position:'top',color:'#8b96a8',fontSize:10,formatter:function(v){return fmtK(v.value);}}}]
    });
  });
}

function initCharts(){
  /* ---- 总览图 ---- */
  var ow=echarts.init(document.getElementById('overview'));
  ow.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},backgroundColor:'#1a2230',borderColor:'#263041',textStyle:{color:'#e6ebf4'}},
    legend:{data:['旧基线','新优化'],textStyle:{color:'#8b96a8'},top:0},
    grid:{left:70,right:30,top:36,bottom:30},
    xAxis:{type:'category',data:['10y','5y','3y'],axisLabel:{color:'#8b96a8'},axisLine:{lineStyle:{color:'#263041'}}},
    yAxis:{type:'log',name:'倍数 (log)',nameTextStyle:{color:'#8b96a8'},axisLabel:{color:'#8b96a8',formatter:fmtK},splitLine:{lineStyle:{color:'#1e2635'}}},
    series:[
      {name:'旧基线',type:'bar',barWidth:34,data:[baseOld['10y'].m,baseOld['5y'].m,baseOld['3y'].m],
        itemStyle:{color:'rgba(96,165,250,.75)',borderRadius:[4,4,0,0]},label:{show:true,position:'top',color:'#8b96a8',formatter:function(p){return fmtK(p.value);},fontSize:11}},
      {name:'新优化',type:'bar',barWidth:34,data:[baseNew['10y'].m,baseNew['5y'].m,baseNew['3y'].m],
        itemStyle:{color:'rgba(34,211,238,.85)',borderRadius:[4,4,0,0]},label:{show:true,position:'top',color:'#22d3ee',formatter:function(p){return fmtK(p.value);},fontSize:11}}
    ]
  });

  /* ---- 净值曲线（三窗口） ---- */
  var NAVS=[['10y','10 年'],['5y','5 年'],['3y','3 年']];
  var grid=document.getElementById('navgrid');
  grid.innerHTML=NAVS.map(function(w){
    return '<div class="panel"><div class="pname">'+w[1]+' 净值</div><div class="psub">旧 '+fmtK(baseOld[w[0]].m)+' → 新 '+fmtK(baseNew[w[0]].m)+' · MDD '+fmtPct(baseOld[w[0]].mdd)+' → '+fmtPct(baseNew[w[0]].mdd)+'</div><div class="navchart" data-w="'+w[0]+'" style="height:260px"></div></div>';
  }).join('');
  document.querySelectorAll('.navchart').forEach(function(el){
    var w=el.dataset.w; var d=window.NAV_CURVES[w]; if(!d) return;
    var ch=echarts.init(el);
    ch.setOption({
      backgroundColor:'transparent',
      tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'#1a2230',borderColor:'#263041',textStyle:{color:'#e6ebf4'},
        formatter:function(ps){
          var i=ps[0].dataIndex; var date=d.dates[i];
          var lines=ps.map(function(p){return p.marker+' '+p.seriesName+': <b>'+fmtNav(p.value)+'</b>';}).join('<br>');
          return '<b>'+date+'</b><br>'+lines;
        }},
      legend:{data:['旧基线','新优化'],textStyle:{color:'#8b96a8'},top:0},
      grid:{left:70,right:26,top:32,bottom:46},
      xAxis:{type:'category',data:d.dates,axisLabel:{color:'#8b96a8',formatter:function(v){var dt=new Date(v);return dt.getFullYear()+'-'+(dt.getMonth()+1);},interval:Math.floor(d.dates.length/8)},axisLine:{lineStyle:{color:'#263041'}}},
      yAxis:{type:'log',name:'净值 (log)',nameTextStyle:{color:'#8b96a8'},axisLabel:{color:'#8b96a8',formatter:fmtNav},splitLine:{lineStyle:{color:'#1e2635'}}},
      dataZoom:[{type:'inside',start:0,end:100},{type:'slider',height:18,bottom:8}],
      series:[
        {name:'旧基线',type:'line',showSymbol:false,smooth:false,data:d.old,lineStyle:{width:1.6,color:'#60a5fa'},itemStyle:{color:'#60a5fa'},areaStyle:{color:'rgba(96,165,250,.08)'}},
        {name:'新优化',type:'line',showSymbol:false,smooth:false,data:d.new,lineStyle:{width:2,color:'#22d3ee'},itemStyle:{color:'#22d3ee'},areaStyle:{color:'rgba(34,211,238,.10)'}}
      ]
    });
  });

  /* ---- 边际贡献条形图 ---- */
  var contrib=echarts.init(document.getElementById('contrib'));
  contrib.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},backgroundColor:'#1a2230',borderColor:'#263041',textStyle:{color:'#e6ebf4'},
      formatter:function(ps){var d=ps[0];var p=params.filter(function(x){return x.param===d.name;})[0];
        return '<b>'+p.param+'</b> '+p.old+'→'+p.new+'<br>'+p.desc+'<br>Δ收益: <b style="color:'+(p.d10>=0?'#34d399':'#f87171')+'">'+(p.d10>0?'+':'')+p.d10+'%</b> · ΔMDD: '+(p.dmdd>0?'+':'')+p.dmdd+'pp · ΔSharpe: '+(p.dsh>0?'+':'')+p.dsh;}},
    grid:{left:220,right:50,top:10,bottom:24},
    xAxis:{type:'value',name:'Δ收益 %',nameTextStyle:{color:'#8b96a8'},axisLabel:{color:'#8b96a8'},splitLine:{lineStyle:{color:'#1e2635'}}},
    yAxis:{type:'category',data:sortedAll.map(function(p){return p.param;}),axisLabel:{color:'#8b96a8',fontSize:11,fontFamily:'Consolas,monospace'},axisLine:{show:false},axisTick:{show:false}},
    series:[{type:'bar',barWidth:16,data:sortedAll.map(function(p){return {value:p.d10,name:p.param,
        itemStyle:{color:p.d10>=0?'rgba(52,211,153,.85)':'rgba(248,113,113,.85)',borderRadius:[0,4,4,0]},
        label:{show:true,position:'right',color:p.d10>=0?'#34d399':'#f87171',formatter:function(v){return (v.value>0?'+':'')+v.value+'%';},fontSize:11}};})}]
  });

  /* ---- 风险-收益散点图（数据坐标 markLine/markArea，resize 自适应） ---- */
  var sc=echarts.init(document.getElementById('scatter'));
  sc.setOption({
    backgroundColor:'transparent',
    tooltip:{backgroundColor:'#1a2230',borderColor:'#263041',textStyle:{color:'#e6ebf4'},
      formatter:function(p){var d=params.filter(function(x){return x.param===p.name;})[0];
        return '<b>'+d.param+'</b> '+d.old+'→'+d.new+'<br>'+d.desc+'<br>Δ收益: <b style="color:'+(d.d10>=0?'#34d399':'#f87171')+'">'+(d.d10>0?'+':'')+d.d10+'%</b><br>ΔMDD: '+(d.dmdd>0?'+':'')+d.dmdd+'pp (负=风险改善)<br>ΔSharpe: '+(d.dsh>0?'+':'')+d.dsh;}},
    grid:{left:70,right:30,top:36,bottom:46},
    xAxis:{type:'value',name:'ΔMDD (pp) → 右移=回撤加大',nameTextStyle:{color:'#8b96a8',fontSize:11},axisLabel:{color:'#8b96a8',formatter:function(v){return v+'pp';}},splitLine:{lineStyle:{color:'#1e2635'}},min:-25,max:10},
    yAxis:{type:'value',name:'Δ收益 %',nameTextStyle:{color:'#8b96a8'},axisLabel:{color:'#8b96a8',formatter:function(v){return v+'%';}},splitLine:{lineStyle:{color:'#1e2635'}},min:-100,max:600},
    visualMap:{show:false,min:-0.3,max:0.5,dimension:2,inRange:{color:['#f87171','#fbbf24','#34d399']}},
    series:[{
      type:'scatter',
      data:params.map(function(p){return {value:[p.dmdd,p.d10,p.dsh],name:p.param,symbolSize:Math.abs(p.dsh)*70+14};}),
      label:{show:true,position:'top',color:'#8b96a8',fontSize:10,fontFamily:'Consolas,monospace',formatter:function(p){return p.data.name;},distance:4},
      itemStyle:{opacity:.9,borderColor:'#0b0e14',borderWidth:1},
      markLine:{silent:true,symbol:'none',data:[{xAxis:0},{yAxis:0}],lineStyle:{color:'#3a4757',type:'dashed',width:1}},
      markArea:{silent:true,
        itemStyle:[{color:'rgba(52,211,153,.06)'},{color:'rgba(251,191,36,.05)'},{color:'rgba(96,165,250,.05)'},{color:'rgba(248,113,113,.06)'}],
        label:{color:'#8b96a8',fontSize:10},
        data:[
          [[{xAxis:-25,yAxis:0},{xAxis:0,yAxis:600}],'收益↑ 风险↓ 理想'],
          [[{xAxis:0,yAxis:0},{xAxis:10,yAxis:600}],'收益↑ 风险↑'],
          [[{xAxis:-25,yAxis:-100},{xAxis:0,yAxis:0}],'收益↓ 风险↓'],
          [[{xAxis:0,yAxis:-100},{xAxis:10,yAxis:0}],'收益↓ 风险↑']
        ]
      }
    }]
  });

  drawMinis();
}

loadEcharts(function(){ if(ECHARTS_READY) initCharts(); });

window.addEventListener('resize',function(){
  ['overview','contrib','scatter'].forEach(function(id){var el=document.getElementById(id);var c=echarts.getInstanceByDom(el);c&&c.resize();});
  document.querySelectorAll('.mini').forEach(function(el){var c=echarts.getInstanceByDom(el);c&&c.resize();});
  document.querySelectorAll('.navchart').forEach(function(el){var c=echarts.getInstanceByDom(el);c&&c.resize();});
});
</script>
